<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>AI тест</title>
<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --text:#111; --muted:#777; --line:#e4e4e0;
    --accent:#111; --ok:#1f9d55; --bad:#d64545; --sel:#f0f0ec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0b0c; --card:#151517; --text:#f2f2f2; --muted:#8a8a8f; --line:#26262a;
      --accent:#f2f2f2; --ok:#3ecf7a; --bad:#ff6b6b; --sel:#1d1d21;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;min-height:100%}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
  .bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:28px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  .tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  h1{font-size:22px;font-weight:650;line-height:1.3;margin-bottom:22px;letter-spacing:-.01em}
  .opts{display:flex;flex-direction:column;gap:10px}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  .opt{
    display:flex;align-items:center;gap:12px;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;min-height:56px;transition:transform .08s,border-color .15s,background .15s;
  }
  .opt:active{transform:scale(.985)}
  .opt b{
    flex:0 0 26px;height:26px;border-radius:8px;border:1px solid var(--line);
    display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)
  }
  .opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
  .opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
  .opt.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
  .lock .opt{pointer-events:none}
  .hidden{display:none!important}

  .res{text-align:center;padding-top:20px}
  .score{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .score span{font-size:28px;color:var(--muted);font-weight:500}
  .lvl{margin:10px 0 28px;color:var(--muted)}
  .code{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;font:600 17px/1.4 ui-monospace,"SF Mono",Menlo,monospace;
    letter-spacing:.02em;word-break:break-all;user-select:all;-webkit-user-select:all;text-align:left
  }
  .code small{display:block;font:12px/1.4 -apple-system,sans-serif;color:var(--muted);margin-bottom:6px;letter-spacing:0}
  .btn{
    width:100%;margin-top:12px;padding:15px;border-radius:14px;font-weight:600;
    background:var(--accent);color:var(--bg);min-height:52px
  }
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .review{margin-top:24px;text-align:left;font-size:14px}
  .review div{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .review div:last-child{border-bottom:1px solid var(--line)}
  .review em{font-style:normal;flex:0 0 22px;font-weight:600}
  .review .y{color:var(--ok)} .review .n{color:var(--bad)}
  .review p{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <section id="quiz">
    <div class="top"><span>AI тест</span><span id="count">1 / 10</span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="tag" id="tag"></div>
    <h1 id="q"></h1>
    <div class="opts" id="opts"></div>
  </section>

  <section id="result" class="res hidden">
    <div class="score" id="score"></div>
    <div class="lvl" id="lvl"></div>
    <div class="code" id="code"></div>
    <button class="btn" id="copy">Скопировать</button>
    <button class="btn ghost" id="again">Пройти заново</button>
    <div class="review" id="review"></div>
  </section>

</div>
<script>
const Q = [
  {t:"Текст", q:"Какая компания делает Claude?", o:["OpenAI","Anthropic","Google","Meta"], a:2},
  {t:"Текст", q:"Как расшифровывается GPT?", o:["General Purpose Tool","Generative Pre-trained Transformer","Graph Processing Technology","Global Prediction Transformer"], a:2},
  {t:"Текст", q:"Gemini — это модели какой компании?", o:["Microsoft","xAI","Google","Amazon"], a:3},
  {t:"Текст", q:"Кто выпускает открытые модели Llama?", o:["Meta","Mistral","Anthropic","Apple"], a:1},
  {t:"Текст", q:"Из какой страны компания Mistral AI?", o:["Германия","США","Китай","Франция"], a:4},
  {t:"Картинки", q:"Что из этого — модель для генерации изображений?", o:["Whisper","BERT","Midjourney","Claude"], a:3},
  {t:"Видео", q:"Sora от OpenAI генерирует…", o:["Музыку","Видео","Код","3D-модели"], a:2},
  {t:"Аудио", q:"Для чего модель Whisper?", o:["Распознавание речи в текст","Генерация картинок","Перевод видео","Поиск в интернете"], a:1},
  {t:"База", q:"Что такое «токен» в языковой модели?", o:["Ключ API","Кусочек текста, которым оперирует модель","Единица оплаты подписки","Слой нейросети"], a:2},
  {t:"База", q:"Статья «Attention Is All You Need» (2017) представила…", o:["Свёрточные сети","Диффузионные модели","Архитектуру Transformer","GAN"], a:3}
];

let i = 0, picks = [];
const $ = id => document.getElementById(id);

function render(){
  const it = Q[i];
  $("count").textContent = (i+1) + " / " + Q.length;
  $("prog").style.width = (i / Q.length * 100) + "%";
  $("tag").textContent = it.t;
  $("q").textContent = it.q;
  const box = $("opts");
  box.className = "opts";
  box.innerHTML = "";
  it.o.forEach((txt, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = "<b>" + (k+1) + "</b><span></span>";
    b.querySelector("span").textContent = txt;
    b.onclick = () => pick(k+1, b);
    box.appendChild(b);
  });
}

function pick(n, el){
  const box = $("opts");
  box.classList.add("lock");
  picks.push(n);
  const right = Q[i].a;
  if (n === right) el.classList.add("ok");
  else { el.classList.add("bad"); box.children[right-1].classList.add("ok"); }
  setTimeout(() => { i++; i < Q.length ? render() : finish(); }, 750);
}

function finish(){
  $("prog").style.width = "100%";
  const s = picks.filter((p,k) => p === Q[k].a).length;
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("score").innerHTML = s + "<span>/" + Q.length + "</span>";
  $("lvl").textContent =
    s === 10 ? "Шаришь полностью" :
    s >= 8 ? "Хорошо разбираешься" :
    s >= 5 ? "Средний уровень" :
    s >= 3 ? "Кое-что знаешь" : "Только начинаешь";
  const line = "AI-тест " + s + "/10 · " + picks.join("-");
  $("code").innerHTML = "<small>Твои ответы (номера вариантов)</small>";
  $("code").appendChild(document.createTextNode(line));
  $("code").dataset.v = line;
  $("review").innerHTML = Q.map((it,k) => {
    const ok = picks[k] === it.a;
    return '<div><em class="'+(ok?"y":"n")+'">'+(k+1)+'</em><p>'+
      (ok ? "Верно" : "Ты: " + picks[k] + " · верно: " + it.a + " — " + it.o[it.a-1]) + '</p></div>';
  }).join("");
  window.scrollTo(0,0);
}

$("copy").onclick = async () => {
  const v = $("code").dataset.v, btn = $("copy");
  try { await navigator.clipboard.writeText(v); }
  catch(e){
    const t = document.createElement("textarea");
    t.value = v; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch(_){}
    t.remove();
  }
  btn.textContent = "Скопировано ✓";
  setTimeout(() => btn.textContent = "Скопировать", 1500);
};

$("again").onclick = () => {
  i = 0; picks = [];
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render();
};

render();
</script>
</body>
</html>
